<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <!-- Fluffy Golden Amber Turpial Feathers with 3D Depth -->
    <radialGradient id="plumpBelly3D" cx="46%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="12%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>
    
    <!-- Obsidian Velvet Shoulder Rim -->
    <radialGradient id="blackNeckCap" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="45%" stop-color="#27272a" />
      <stop offset="80%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Feet Material -->
    <linearGradient id="birdLegGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Tail Feathers in back -->
  <g fill="#09090b" stroke="#18181b" stroke-width="1.5">
    <path d="M92,165 L100,208 L108,165 Z" />
    <path d="M82,162 L88,204 L96,164 Z" />
    <path d="M118,162 L112,204 L104,164 Z" />
  </g>

  <!-- 2. Realistic 3D Bird Feet / Talons -->
  <g filter="url(#shadowFilter)">
    <!-- Left Leg & Claws -->
    <path d="M80,175 L74,212 M62,220 L74,212 L64,226 M74,212 L76,227 M74,212 L87,222 M74,212 L80,205" stroke="url(#birdLegGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M62,220 L74,212 L64,226 M74,212 L76,227 M74,212 L87,222" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />

    <!-- Right Leg & Claws -->
    <path d="M120,175 L126,212 M114,220 L126,212 L116,226 M126,212 L124,227 M126,212 L138,222 M126,212 L120,205" stroke="url(#birdLegGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M114,220 L126,212 L116,226 M126,212 L124,227 M126,212 L138,222" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />
  </g>

  <!-- 3. Plump Spherical Chubby Body with Soft Fur / Feathers -->
  <g filter="url(#shadowFilter)">
    <!-- Base Body Sphere -->
    <path d="M52,50 C30,90 34,160 100,180 C166,160 170,90 148,50 C135,32 65,32 52,50 Z" fill="url(#plumpBelly3D)" />
    
    <!-- Feather Shading on Belly -->
    <ellipse cx="100" cy="115" rx="55" ry="50" fill="#fbbf24" opacity="0.45" />
    <ellipse cx="100" cy="140" rx="42" ry="32" fill="#f59e0b" opacity="0.35" />
    <ellipse cx="94" cy="95" rx="34" ry="26" fill="#fffbeb" opacity="0.5" />
  </g>

  <!-- 4. Top Neck Joint / Socket Peg for Animated Head Assembly -->
  <ellipse cx="100" cy="42" rx="46" ry="16" fill="url(#blackNeckCap)" stroke="#09090b" stroke-width="2" />
</svg>
