<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 135" width="110" height="135">
  <defs>
    <!-- Wing Amber Gold Feathers -->
    <radialGradient id="wingDerGold" cx="15%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    
    <linearGradient id="featherDerDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="featherDerMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="50%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <filter id="wingDerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#wingDerShadow)">
    <!-- 1. Primary Flight Feathers (Remiges - Outer Right Edge) -->
    <path d="M12,35 C40,22 85,55 105,100 C95,108 80,102 65,88 C45,70 20,48 12,35 Z" fill="url(#featherDerDark)" />
    <path d="M15,45 C35,36 72,68 92,112 C82,118 68,112 55,98 C38,80 18,55 15,45 Z" fill="url(#featherDerMid)" />
    <path d="M18,55 C32,48 62,80 78,122 C68,126 55,120 42,108 C30,92 20,65 18,55 Z" fill="url(#featherDerDark)" />
    <path d="M22,65 C32,60 52,92 62,130 C52,132 40,126 32,115 C25,100 22,75 22,65 Z" fill="url(#featherDerMid)" />

    <!-- 2. Distinct White Turpial Wing Bar (Speculum) -->
    <path d="M15,25 C35,32 60,55 75,78 C68,84 55,80 40,62 C25,45 15,32 15,25 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <path d="M20,35 C35,45 52,68 65,88 C58,94 48,88 35,72 C25,56 20,42 20,35 Z" fill="#f1f5f9" />

    <!-- 3. Velvet Black Median Covert Band -->
    <path d="M12,20 C28,26 48,42 60,58 C52,64 40,60 28,46 C18,34 12,24 12,20 Z" fill="#09090b" />

    <!-- 4. Fluffy Golden Turpial Shoulder / Epaulet (Yellow-Orange Coverts) -->
    <path d="M8,12 C22,10 38,22 48,38 C50,52 35,70 18,72 C6,70 4,45 4,25 C4,16 5,12 8,12 Z" fill="url(#wingDerGold)" />
    
    <!-- Feather Scallop Texture on Shoulder -->
    <path d="M32,32 Q22,28 12,34 Q22,40 32,32 Z" fill="#fef08a" opacity="0.6" />
    <path d="M38,44 Q26,38 14,46 Q26,52 38,44 Z" fill="#fef08a" opacity="0.5" />
    <path d="M30,56 Q20,50 10,58 Q20,64 30,56 Z" fill="#fde047" opacity="0.4" />
  </g>
</svg>
