<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 45" width="60" height="45">
  <defs>
    <!-- Lower Beak 3D Gradient matching uploaded image -->
    <linearGradient id="beakLowSlate3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="75%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <radialGradient id="tongueGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="60%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </radialGradient>

    <filter id="beakLowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#beakLowShadow)">
    <!-- Lower Mandible Curved Shell -->
    <path 
      d="M6,6 C16,4 44,4 54,6 C52,18 42,34 30,36 C18,34 8,18 6,6 Z" 
      fill="url(#beakLowSlate3D)" 
      stroke="#0f172a" 
      stroke-width="1.2" 
    />
    <!-- Interior Oral Cavity / Mouth Depth -->
    <path 
      d="M10,8 C20,6 40,6 50,8 C46,16 38,22 30,22 C22,22 14,16 10,8 Z" 
      fill="#18181b" 
    />
    <!-- Articulated Tongue with Specular Highlight -->
    <ellipse cx="30" cy="14" rx="10" ry="5.5" fill="url(#tongueGrad)" />
    <ellipse cx="29" cy="12.5" rx="5" ry="2" fill="#ffffff" opacity="0.6" />
    <!-- Ridge Center Highlight -->
    <path d="M30,8 L30,36" stroke="#64748b" stroke-width="1" opacity="0.4" />
  </g>
</svg>
