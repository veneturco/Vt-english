<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="160" height="150">
  <defs>
    <!-- Velvet Obsidian Head Fur Gradient with 3D Depth -->
    <radialGradient id="headVelvet3D" cx="48%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="45%" stop-color="#27272a" />
      <stop offset="80%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Golden Eyebrows Gradient -->
    <linearGradient id="browGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glasses Gold Metallic Frame Gradient -->
    <linearGradient id="glassesGoldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Amber Iris Gradient with Depth -->
    <radialGradient id="irisAmberGrad" cx="40%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#ca8a04" />
      <stop offset="75%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <!-- Beak Slate Gradient -->
    <linearGradient id="beakTopSlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="headShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#headShadow)">
    <!-- 1. Main Spherical Chubby Velvet Head -->
    <path 
      d="M80,18 C46,18 30,42 30,80 C30,118 52,132 80,132 C108,132 130,118 130,80 C130,42 114,18 80,18 Z" 
      fill="url(#headVelvet3D)" 
    />
    
    <!-- Fluffy Head Texture Tufts -->
    <path d="M74,18 C70,10 76,8 80,12 C84,8 90,11 86,18 Z" fill="#18181b" />
    <ellipse cx="80" cy="40" rx="36" ry="20" fill="#3f3f46" opacity="0.3" />

    <!-- 2. Expressive Yellow-Golden Eyebrows (Professor Brows) -->
    <!-- Left Brow -->
    <path d="M46,47 C52,40 64,40 70,46 C65,51 51,51 46,47 Z" fill="url(#browGoldGrad)" stroke="#b45309" stroke-width="0.8" />
    <!-- Right Brow -->
    <path d="M90,46 C96,40 108,40 114,47 C109,51 95,51 90,46 Z" fill="url(#browGoldGrad)" stroke="#b45309" stroke-width="0.8" />

    <!-- 3. Eyes Behind Glasses -->
    <!-- Left Eye Sclera & Iris -->
    <g id="leftEyeGroup">
      <ellipse cx="58" cy="68" rx="19" ry="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
      <ellipse cx="61" cy="68" rx="11" ry="13" fill="url(#irisAmberGrad)" />
      <ellipse cx="61" cy="68" rx="7" ry="8.5" fill="#09090b" />
      <!-- Specular Eye Highlights -->
      <circle cx="58" cy="64" r="3.5" fill="#ffffff" />
      <circle cx="64" cy="72" r="1.5" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Right Eye Sclera & Iris -->
    <g id="rightEyeGroup">
      <ellipse cx="102" cy="68" rx="19" ry="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
      <ellipse cx="99" cy="68" rx="11" ry="13" fill="url(#irisAmberGrad)" />
      <ellipse cx="99" cy="68" rx="7" ry="8.5" fill="#09090b" />
      <!-- Specular Eye Highlights -->
      <circle cx="96" cy="64" r="3.5" fill="#ffffff" />
      <circle cx="102" cy="72" r="1.5" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- 4. Upper Beak (Pico Superior con cresta central) -->
    <path 
      d="M62,84 C68,74 74,70 80,70 C86,70 92,74 98,84 C92,94 86,98 80,98 C74,98 68,94 62,84 Z" 
      fill="url(#beakTopSlate)" 
      stroke="#1e293b" 
      stroke-width="1.5" 
    />
    <path d="M80,70 L80,98" stroke="#475569" stroke-width="1.2" opacity="0.8" />
    <!-- Nostrils -->
    <ellipse cx="73" cy="77" rx="1.5" ry="0.8" fill="#0f172a" />
    <ellipse cx="87" cy="77" rx="1.5" ry="0.8" fill="#0f172a" />

    <!-- 5. Professor Round Glasses (Gafas Académicas Doradas con Reflejo de Cristal) -->
    <!-- Bridge -->
    <path d="M78,66 Q80,63 82,66" stroke="url(#glassesGoldFrame)" stroke-width="3" fill="none" stroke-linecap="round" />
    
    <!-- Left Glass Frame & Lens -->
    <circle cx="58" cy="68" r="23" fill="rgba(255, 255, 255, 0.12)" stroke="url(#glassesGoldFrame)" stroke-width="3.5" />
    <circle cx="58" cy="68" r="21.5" fill="none" stroke="#fef08a" stroke-width="0.8" opacity="0.7" />
    <!-- Lens Specular Glare Curve -->
    <path d="M42,54 C48,48 68,48 74,54 C66,51 50,51 42,54 Z" fill="#ffffff" opacity="0.65" />

    <!-- Right Glass Frame & Lens -->
    <circle cx="102" cy="68" r="23" fill="rgba(255, 255, 255, 0.12)" stroke="url(#glassesGoldFrame)" stroke-width="3.5" />
    <circle cx="102" cy="68" r="21.5" fill="none" stroke="#fef08a" stroke-width="0.8" opacity="0.7" />
    <!-- Lens Specular Glare Curve -->
    <path d="M86,54 C92,48 112,48 118,54 C110,51 94,51 86,54 Z" fill="#ffffff" opacity="0.65" />
    
    <!-- Side Temples (Patillas) -->
    <path d="M35,66 L28,64" stroke="url(#glassesGoldFrame)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M125,66 L132,64" stroke="url(#glassesGoldFrame)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
