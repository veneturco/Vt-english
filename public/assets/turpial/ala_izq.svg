<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 135" width="110" height="135">
  <defs>
    <!-- Realistic Turpial Wing Feathers with Yellow-Golden Shoulder Coverts -->
    <radialGradient id="wingShoulderGold" cx="85%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    
    <linearGradient id="featherDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="featherMidGrey" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="50%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <filter id="wingShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#wingShadow)">
    <!-- 1. Primary Flight Feathers (Remiges - Outer Edge) -->
    <path d="M98,35 C70,22 25,55 5,100 C15,108 30,102 45,88 C65,70 90,48 98,35 Z" fill="url(#featherDark)" />
    <path d="M95,45 C75,36 38,68 18,112 C28,118 42,112 55,98 C72,80 92,55 95,45 Z" fill="url(#featherMidGrey)" />
    <path d="M92,55 C78,48 48,80 32,122 C42,126 55,120 68,108 C80,92 90,65 92,55 Z" fill="url(#featherDark)" />
    <path d="M88,65 C78,60 58,92 48,130 C58,132 70,126 78,115 C85,100 88,75 88,65 Z" fill="url(#featherMidGrey)" />

    <!-- 2. Distinct White Turpial Wing Bar (Speculum) -->
    <path d="M95,25 C75,32 50,55 35,78 C42,84 55,80 70,62 C85,45 95,32 95,25 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <path d="M90,35 C75,45 58,68 45,88 C52,94 62,88 75,72 C85,56 90,42 90,35 Z" fill="#f1f5f9" />

    <!-- 3. Velvet Black Median Covert Band -->
    <path d="M98,20 C82,26 62,42 50,58 C58,64 70,60 82,46 C92,34 98,24 98,20 Z" fill="#09090b" />

    <!-- 4. Fluffy Golden Turpial Shoulder / Epaulet (Yellow-Orange Coverts) -->
    <path d="M102,12 C88,10 72,22 62,38 C60,52 75,70 92,72 C104,70 106,45 106,25 C106,16 105,12 102,12 Z" fill="url(#wingShoulderGold)" />
    
    <!-- Feather Scallop Texture on Shoulder -->
    <path d="M78,32 Q88,28 98,34 Q88,40 78,32 Z" fill="#fef08a" opacity="0.6" />
    <path d="M72,44 Q84,38 96,46 Q84,52 72,44 Z" fill="#fef08a" opacity="0.5" />
    <path d="M80,56 Q90,50 100,58 Q90,64 80,56 Z" fill="#fde047" opacity="0.4" />
  </g>
</svg>
