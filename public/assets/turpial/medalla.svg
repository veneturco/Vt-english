<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <!-- Gold Chain Link Metallic Gradient -->
    <linearGradient id="goldChainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- 3D Gold Coin Radial Gradient -->
    <radialGradient id="goldCoin3D" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="90%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>

    <filter id="medallaGlowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#medallaGlowShadow)">
    <!-- 1. Gold Link Chain Hanging from Neck -->
    <!-- Left Chain Segment -->
    <path 
      d="M32,2 Q44,38 50,56" 
      stroke="url(#goldChainGrad)" 
      stroke-width="3" 
      stroke-linecap="round" 
      stroke-dasharray="3 2" 
      fill="none" 
    />
    <!-- Right Chain Segment -->
    <path 
      d="M68,2 Q56,38 50,56" 
      stroke="url(#goldChainGrad)" 
      stroke-width="3" 
      stroke-linecap="round" 
      stroke-dasharray="3 2" 
      fill="none" 
    />

    <!-- Bail / Ring Connector -->
    <rect x="47" y="52" width="6" height="8" rx="2" fill="url(#goldChainGrad)" stroke="#713f12" stroke-width="1" />

    <!-- 2. Circular Coin Medallion with Raised Border -->
    <circle cx="50" cy="80" r="24" fill="url(#goldCoin3D)" stroke="#713f12" stroke-width="2" />
    <!-- Beaded Inner Rim -->
    <circle cx="50" cy="80" r="20.5" fill="none" stroke="#a16207" stroke-width="1.2" stroke-dasharray="2 1.5" />
    <circle cx="50" cy="80" r="19" fill="none" stroke="#fef08a" stroke-width="0.8" opacity="0.8" />

    <!-- Laurel Wreath Around Rim -->
    <path d="M34,78 Q36,66 46,63" stroke="#854d0e" stroke-width="1" fill="none" />
    <path d="M66,78 Q64,66 54,63" stroke="#854d0e" stroke-width="1" fill="none" />

    <!-- 3. Embossed VT Monogram -->
    <text 
      x="50" 
      y="88" 
      text-anchor="middle" 
      font-size="18" 
      font-weight="900" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
      letter-spacing="1" 
      fill="#713f12"
      style="filter: drop-shadow(0 1.2px 1px rgba(254, 240, 138, 0.95));"
    >
      VT
    </text>

    <!-- Specular Highlight Sheen -->
    <path d="M37,67 Q50,62 63,67 C56,71 44,71 37,67 Z" fill="#ffffff" opacity="0.75" />
  </g>
</svg>
